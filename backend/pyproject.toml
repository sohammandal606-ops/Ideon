# Authoritative package, development-tool, and lint configuration for the backend.
[project]
name = "ideon-backend"
version = "0.1.0"
description = "Backend for IDEON, an AI-powered startup builder platform."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "langchain>=1.3.15",
    "langgraph>=1.2.11",
    "pgvector>=0.5.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "email-validator>=2.3.0",
    "python-dotenv>=1.2.2",
    "sqlmodel>=0.0.39",
    "supabase>=2.31.0",
    "uvicorn[standard]>=0.52.1",
    "langchain-mistralai>=1.1.6",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.14.0",
]

[tool.ruff]
target-version = "py312"
line-length = 88
# Alembic migrations are auto-generated — don't lint them.
exclude = ["db/migrations/versions/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Depends() in function defaults is the standard FastAPI DI pattern.
"api/v1/deps.py" = ["B008"]

[tool.pytest.ini_options]
pythonpath = [
  "."
]
